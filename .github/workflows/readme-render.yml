name: readme-render
on:
  push:
    branches: [main]
    paths: ['data/snapshots/**']
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render
        run: python3 scripts/render-readme-from-snapshot.py
      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "readme-render-bot"
          git config user.email "readme-render-bot@users.noreply.github.com"
          if git diff --quiet README.md CHANGELOG.md; then
            echo "no change, snapshot and readme aligned"
            exit 0
          fi
          SNAP=$(ls -t data/snapshots | head -1 | sed 's/\.json$//')
          BR="readme/render-$SNAP"
          git checkout -b "$BR"
          git add README.md CHANGELOG.md
          git commit -m "readme-render: render from snapshot $SNAP"
          git push origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "[Readme-Render-Bot] README render from snapshot $SNAP" \
            --body "PR category: bot README render (exempt from plugin-registration template). Data source: latest merged snapshot in data/snapshots/ (renderer reads snapshot only). run_id anchor: $SNAP." \
            || echo "pr create skipped"
